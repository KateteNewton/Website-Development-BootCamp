<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule</title>
    <link rel="Stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="schedule.html">Schedule</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <table>
            <caption>My Daily Schedule</caption>

            <thead>
                <tr>
                    <th scope="col">DAY / TIME</th>
                    <th scope="col">06-17</th>
                    <th scope="col">17-18</th>
                    <th scope="col">20-22</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td scope="row">Monday</td>
                    <td rowspan="4">Work</td>
                    <td rowspan="3">Supper</td>
                    <td rowspan="4">Meeting</td>
                </tr>

                <tr>
                    <td scope="row">Tuesday</td>
                    
                    
                    
                </tr>

                <tr>
                    <td scope="row">Wednesday</td>
                    
                </tr>

                <tr>
                    <td scope="row">Thursday</td>
                    
                    <td>Leisure</td>
                    
                </tr>

                <tr>
                    <td scope="row">Friday</td>
                    <td>Sports</td>
                    <td>Supper</td>
                    <td>Devotion</td>
                </tr>
            </tbody>

            <tfoot>
                <tr>
                    <td colspan="4">My Personalised schedule</td>
                </tr>
            </tfoot>
        </table>

    </main>
    <footer>

    </footer>
</body>
</html>
